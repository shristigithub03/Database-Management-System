<header class="header">
  <div class="header-left">
    <h2 class="mb-0">{{ getPageTitle() }}</h2>
  </div>

  <div class="header-right" *ngIf="authService.isAuthenticated()">
    <div class="search-box d-none d-md-block">
      <i class="fas fa-search"></i>
      <input type="text" class="form-control" placeholder="Search documents..."
             [(ngModel)]="searchQuery" (keyup.enter)="performSearch()">
    </div>
    
    <div class="user-menu" (click)="toggleDropdown($event)">
      <div class="user-avatar">
        {{ authService.getUserInitials() }}
      </div>
      <div class="user-info d-none d-md-block">
        <div class="user-name">{{ authService.getUserName() }}</div>
        <div class="user-role">{{ authService.getUserRole() }}</div>
      </div>
      <i class="fas fa-chevron-down ms-2"></i>
    </div>

    <div class="dropdown-menu" [class.show]="dropdownOpen" (click)="$event.stopPropagation()">
      <a class="dropdown-item" routerLink="/profile" (click)="closeDropdown()">
        <i class="fas fa-user me-2"></i> Profile
      </a>
      <a class="dropdown-item" (click)="openSettings()">
        <i class="fas fa-cog me-2"></i> Settings
      </a>
      <div class="dropdown-divider"></div>
      <a class="dropdown-item text-danger" (click)="logout()">
        <i class="fas fa-sign-out-alt me-2"></i> Logout
      </a>
    </div>
  </div>
</header>
